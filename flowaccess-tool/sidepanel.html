<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlowAccess — Saved Projects</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --border: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #1a73e8;
    --danger: #ef4444;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Google Sans', Roboto, 'Segoe UI', Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    min-height: 100vh;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg);
    padding: 14px 14px 10px;
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 16px; font-weight: 600; }
  header h1 span { color: var(--muted); font-weight: 400; font-size: 13px; }
  .toolbar { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .toolbar input[type="search"] {
    flex: 1; min-width: 120px;
    background: var(--card); border: 1px solid var(--border);
    color: var(--text); border-radius: 8px; padding: 8px 10px; font-size: 13px;
  }
  .toolbar select {
    background: var(--card); border: 1px solid var(--border);
    color: var(--text); border-radius: 8px; padding: 8px; font-size: 13px;
  }
  .actions { display: flex; gap: 8px; margin-top: 8px; }
  button {
    cursor: pointer; border: none; border-radius: 8px;
    padding: 8px 12px; font-size: 13px; font-weight: 500;
    font-family: inherit;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #1557b0; }
  .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
  .btn-ghost:hover { background: var(--card); }
  .btn-danger-ghost { background: transparent; border: 1px solid var(--border); color: var(--danger); }
  .btn-danger-ghost:hover { background: rgba(239,68,68,.12); }
  #toast {
    display: none; margin-top: 8px; font-size: 12px; color: #4ade80;
  }
  #list { padding: 10px 14px 20px; display: flex; flex-direction: column; gap: 8px; }
  .proj {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px;
  }
  .proj .name { font-weight: 600; font-size: 13.5px; word-break: break-word; }
  .proj .meta { color: var(--muted); font-size: 11.5px; margin-top: 3px; word-break: break-all; }
  .proj .row-btns { display: flex; gap: 6px; margin-top: 8px; }
  .proj .row-btns button { padding: 6px 10px; font-size: 12px; }
  .empty { color: var(--muted); text-align: center; padding: 30px 10px; font-size: 13px; }
</style>
</head>
<body>
  <header>
    <h1>📁 Saved Projects <span id="count"></span></h1>
    <div class="toolbar">
      <input type="search" id="search" placeholder="Search projects…">
      <select id="format" title="Copy format">
        <option value="link">Link</option>
        <option value="markdown">Markdown</option>
        <option value="html">HTML</option>
        <option value="id">Project ID</option>
      </select>
    </div>
    <div class="actions">
      <button class="btn-primary" id="copyAll">⧉ Copy All</button>
      <button class="btn-danger-ghost" id="clearAll">🗑 Clear All</button>
    </div>
    <div id="toast"></div>
  </header>
  <div id="list"></div>

  <script src="fa-shared.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
